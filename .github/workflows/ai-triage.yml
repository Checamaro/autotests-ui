# ИИ-разбор упавшего прогона. Запускается после workflow "UI tests", только если он упал.
# Провайдер и модель — в ai/config.toml (любой OpenAI-совместимый API).
# Нужен секрет репозитория LLM_API_KEY (имя задаётся в ai/config.toml → provider.api_key_env).
name: AI triage

on:
  workflow_run:
    workflows: ["UI tests"]
    types: [completed]

jobs:
  triage:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download Allure results from the failed run
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Скрипт использует только стандартную библиотеку Python — ставить ничего не нужно
      - name: AI triage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: >-
          python tools/ai/triage.py allure-results
          --run-url "${{ github.event.workflow_run.html_url }}"
          --run-number "${{ github.event.workflow_run.run_number }}"
